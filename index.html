function doBook(){const b={id:nid(S.bookings),room:$('#bR').value,date:$('#bD').value,s:$('#bS').value,e:$('#bE').value,code:$('#bC').value.trim().toUpperCase(),name:$('#bN').value.trim(),type:+$('#bT').value,by:me.name};

S.bookings.push(b);notify('admin',`${b.by} จอง ${b.code} ${rn(b.room)} ${b.date}`);if(b.type<2)notify('ช่างเทคนิค',`เตรียม${TY[b.type]} ${b.code} ${b.date} ${b.s}`);sv();toast('✅ จองสำเร็จ');go('sched')}
function schedV(){const d=window.fd||'';let L=srt(S.bookings).filter(b=>!d||b.date==d);return`<h1>ตารางเรียน</h1><div class=row><input type=date value="${d}" onchange="fd=this.value;R()" style="width:auto"><button class="btn s g" onclick="fd='';R()">ทั้งหมด</button><span class=sp>${exb('s',"exp('ตารางเรียน',[['วันที่','เริ่ม','สิ้นสุด','ห้อง','รหัส','วิชา','ประเภท','ผู้จอง'],...srt(S.bookings).map(b=>[b.date,b.s,b.e,rn(b.room),b.code,b.name,TY[b.type],b.by])])")}</span></div><div class="g g2" style="margin-bottom:16px"><div class=card><h2>ประเภทการสอน</h2>${donut(TY.map((t,i)=>[t,L.filter(b=>b.type==i).length]))}</div><div class=card><h2>จำนวนต่อห้อง</h2>${bars(S.rooms.map(r=>[r.n,L.filter(b=>b.room==r.id).length]))}</div></div><div class="card tw"><table><tr><th>วันที่<th>เวลา<th>ห้อง<th>รหัส<th>วิชา<th>ประเภท<th>ผู้จอง${me.role=='admin'?'<th>':''}</tr>${L.map((b,i)=>`<tr style="animation-delay:${i*.04}s"><td>${b.date}<td>${b.s}-${b.e}<td>${rn(b.room)}<td><b>${esc(b.code)}</b><td>${esc(b.name)}<td><span class="tag t${b.type}">${TY[b.type]}</span><td>${esc(b.by)}${me.role=='admin'?`<td><button class="btn s r" onclick="S.bookings=S.bookings.filter(x=>x.id!=${b.id});sv();R()">ลบ</button>`:''}</tr>`).join('')||'<tr><td>ไม่พบรายการ</tr>'}</table></div>`}
function searchV(){const L=srt(S.bookings).filter(b=>q&&(b.code.includes(q.toUpperCase())||b.name.toLowerCase().includes(q.toLowerCase())));return`<h1>ค้นหาวิชา</h1><p class=sub>พิมพ์รหัสวิชาเพื่อดูเวลาไลฟ์สดและอัดเทป</p><div class=row><input id=sq value="${esc(q)}" placeholder="เช่น CS101" oninput="q=this.value;clearTimeout(window.tm);tm=setTimeout(()=>{R();const e=$('#sq');e.focus();e.setSelectionRange(99,99)},250)" style="width:min(360px,100%)"><span class=sp>${exb('r',"exp('ผลค้นหา',[['รหัส','วันที่','เวลา','ประเภท','ห้อง'],...S.bookings.filter(b=>q&&b.code.includes(q.toUpperCase())).map(b=>[b.code,b.date,b.s+'-'+b.e,TY[b.type],rn(b.room)])])")}</span></div>
${q&&L.length?`<div class=card style="margin-bottom:16px"><h2>สรุปรอบของวิชา</h2>${bars(TY.map((t,i)=>[t,L.filter(b=>b.type==i).length]))}</div>`:''}<div class="g g3">${L.map((b,i)=>`<div class=card style="animation-delay:${i*.06}s"><span class="tag t${b.type}">${['🔴','⏺️','📖'][b.type]} ${TY[b.type]}</span><h2 style="margin-top:10px">${esc(b.code)} ${esc(b.name)}</h2><p>📅 ${b.date}<br>⏰ ${b.s} – ${b.e}<br>📍 ${rn(b.room)}<br>👤 ${esc(b.by)}</p></div>`).join('')||`<p class=sub>${q?'ไม่พบวิชานี้':'เริ่มพิมพ์เพื่อค้นหา'}</p>`}</div>`}
function tasksV(){const A=me.role=='admin';let L=S.tasks.filter(t=>A||t.g==me.g);return`<h1>แจ้งงาน</h1><p class=sub>${A?'สร้างงานและส่งแจ้งเตือนไปยังพนักงานทั้ง 3 หมวด':'งานที่มอบหมายให้หมวด '+me.g}</p>
${A?`<div class=card style="margin-bottom:16px"><div class="g g3"><div><label>หัวข้องาน</label><input id=kT></div><div><label>หมวดพนักงาน</label><select id=kG>${GR.map(g=>`<option>${g}</option>`).join('')}</select></div><div><label>ความสำคัญ</label><select id=kP><option value=l>ปกติ<option value=m>ด่วน<option value=h>ด่วนมาก</select></div><div><label>กำหนดส่ง</label><input type=date id=kD value="${iso(1)}"></div></div><label>รายละเอียด</label><textarea id=kX rows=2></textarea><br><button class=btn onclick="addT()">🔔 แจ้งงาน</button></div>`:''}
<div class="g g2" style="margin-bottom:16px"><div class=card><h2>สถานะงาน</h2>${donut(ST.map((s,i)=>[s,L.filter(t=>t.s==i).length]))}</div><div class=card><h2>งานแต่ละหมวด</h2>${bars(GR.map(g=>[g,L.filter(t=>t.g==g).length]))}</div></div><div class=row><span class=sp>${exb('t',"exp('งาน',[['งาน','หมวด','กำหนด','สถานะ'],...S.tasks.map(t=>[t.t,t.g,t.due,ST[t.s]])])")}</span></div><div class="g g2">${L.map((t,i)=>`<div class="card tk ${t.p}" style="animation-delay:${i*.05}s"><b>${esc(t.t)}</b> <span class=tag>${t.g}</span><p class=sub>${esc(t.d)}<br>กำหนด ${t.due}</p><select onchange="setT(${t.id},this.value)">${ST.map((s,j)=>`<option value=${j} ${t.s==j?'selected':''}>${s}</option>`).join('')}</select>${A?` <button class="btn s r" onclick="S.tasks=S.tasks.filter(x=>x.id!=${t.id});sv();R()">ลบ</button>`:''}</div>`).join('')||'<p class=sub>ยังไม่มีงาน</p>'}</div>`}
function addT(){const t=$('#kT').value.trim();if(!t)return toast('ใส่หัวข้องาน');const o={id:nid(S.tasks),t,g:$('#kG').value,p:$('#kP').value,due:$('#kD').value,d:$('#kX').value,s:0};S.tasks.unshift(o);notify(o.g,'งานใหม่: '+t);toast('ส่งแจ้งงานถึง '+o.g+' แล้ว');R()}
function setT(id,v){const t=S.tasks.find(x=>x.id==id);t.s=+v;notify('admin',`${t.g}: "${t.t}" → ${ST[t.s]}`);toast('อัปเดตสถานะแล้ว');R()}
function galV(){const L=S.photos.filter(p=>gf=='all'||p.f==gf);return`<h1>ผลงาน / อัลบั้ม</h1><p class=sub>ถ่ายรูปหรืออัปโหลด แล้วเลือกโฟลเดอร์ ระบุงานและรายละเอียดของรูป</p><div class=card style="margin-bottom:16px"><div class="g g3"><div><label>โฟลเดอร์ (ดรอปดาวน์)</label><select id=pF>${FD.map(f=>`<option>${f}</option>`).join('')}</select></div><div><label>งานอะไร</label><input id=pJ></div><div><label>รูปของอะไร</label><input id=pW></div></div><label>เลือกรูป / ถ่ายด้วยกล้อง</label><input type=file id=pI accept="image/*" capture="environment" multiple><br><br><button class=btn onclick="addP()">📷 บันทึกรูป</button></div>
<div class="g g2" style="margin-bottom:16px"><div class=card><h2>รูปแต่ละโฟลเดอร์</h2>${bars(FD.map(f=>[f,S.photos.filter(p=>p.f==f).length]))}</div><div class="card tw"><h2>ตารางผลงานล่าสุด</h2>${tbl(['โฟลเดอร์','งาน','รูปของ','ผู้บันทึก'],S.photos.slice(0,5).map(p=>[p.f,p.j,p.w,p.by]))}</div></div><div class=row><select onchange="gf=this.value;R()" style="width:auto"><option value=all>ทุกโฟลเดอร์</option>${FD.map(f=>`<option ${gf==f?'selected':''}>${f}</option>`).join('')}</select><span class=sp>${exb('g',"exp('ผลงาน',[['โฟลเดอร์','งาน','รูปของ','วันที่','ผู้บันทึก'],...S.photos.map(p=>[p.f,p.j,p.w,p.d,p.by])])")}</span></div>
<div class="g g3">${L.map((p,i)=>`<div class=card style="animation-delay:${i*.05}s"><div class=ph style="background-image:url(${p.u})" onclick="lb(${p.id})"></div><span class=tag>${p.f}</span><p><b>${esc(p.j)}</b><br><span class=sub>${esc(p.w)} · ${p.d} · ${esc(p.by)}</span></p>${me.role=='admin'?`<button class="btn s r" onclick="S.photos=S.photos.filter(x=>x.id!=${p.id});sv();R()">ลบ</button>`:''}</div>`).join('')||'<p class=sub>ยังไม่มีรูป</p>'}</div>`}
function addP(){const fs=[...$('#pI').files];if(!fs.length)return toast('เลือกรูปก่อน');let n=0;fs.forEach(f=>img(f,u=>{S.photos.unshift({id:nid(S.photos)+n++,f:$('#pF').value,j:$('#pJ').value||'-',w:$('#pW').value||'-',d:iso(0),by:me.name,u});if(n==fs.length){sv();toast('บันทึกรูปแล้ว');R()}}))}
function lb(id){const p=S.photos.find(x=>x.id==id),d=document.createElement('div');d.className='lb';d.onclick=()=>d.remove();d.innerHTML=`<img src="${p.u}">`;document.body.appendChild(d)}
function orgV(){const o=S.org,A=me&&me.role=='admin',E=A&&ed;const up=(cb)=>`onchange="img(this.files[0],u=>{${cb}=u;sv();R()})"`;
return`<div class=hero style="${o.img?`background-image:url(${o.img})`:''}"><div>${E?`<input value="${esc(o.name)}" oninput="S.org.name=this.value;sv()" style="font-size:22px;margin-bottom:6px"><textarea rows=2 oninput="S.org.desc=this.value;sv()">${esc(o.desc)}</textarea><input type=file accept="image/*" ${up('S.org.img')}>`:`<h1>${esc(o.name)}</h1><p>${esc(o.desc)}</p>${me?'':`<button class="btn w" onclick="tg('lm')">เข้าสู่ระบบเพื่อจองเลย</button>`}`}</div></div>
<div class="g g4" style="margin-bottom:16px">${kp(S.rooms.length,'ห้อง/สตูดิโอ')}${kp(S.bookings.length,'การจองทั้งหมด')}${kp(S.photos.length,'ผลงาน')}${kp(S.tasks.length,'งานทั้งหมด')}</div><div class="card tw" style="margin-bottom:16px"><h2>ห้องที่เปิดให้บริการ</h2>${tbl(['ห้อง','ความจุ','จำนวนการจอง'],S.rooms.map(r=>[r.n,r.c+' ที่',S.bookings.filter(b=>b.room==r.id).length]))}</div><div class=row><h2 style="margin:0">แนะนำหน่วยงาน</h2><span class=sp>${A?`<button class="btn s" onclick="ed=!ed;R()">${ed?'✔ เสร็จสิ้น':'✏️ แก้ไขเทมเพลต'}</button> `:''}${me?exb('o',"exp('หน่วยงาน',[['หัวข้อ','รายละเอียด'],...S.org.secs.map(s=>[s.t,s.d])])"):''}</span></div>
<div class="g g2">${o.secs.map((s,i)=>`<div class=card style="animation-delay:${i*.1}s">${s.img?`<div class=ph style="background-image:url(${s.img});cursor:default"></div>`:''}${E?`<input value="${esc(s.t)}" oninput="S.org.secs[${i}].t=this.value;sv()"><textarea rows=3 oninput="S.org.secs[${i}].d=this.value;sv()">${esc(s.d)}</textarea><input type=file accept="image/*" ${up('S.org.secs['+i+'].img')}><br><br><button class="btn s r" onclick="S.org.secs.splice(${i},1);sv();R()">ลบส่วนนี้</button>`:`<h2>${esc(s.t)}</h2><p>${esc(s.d)}</p>`}</div>`).join('')}${E?`<div class=card style="display:grid;place-items:center"><button class=btn onclick="S.org.secs.push({t:'หัวข้อใหม่',d:'',img:''});sv();R()">+ เพิ่มส่วน</button></div>`:''}</div>`}
R();
</script></body></html>
